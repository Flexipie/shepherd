name: Bug
description: Something in Shepherd does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A security problem goes through the Security tab instead, not here.
        Please leave out real paths, project names and tokens you would not want public.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start two Claude Code agents in tmux
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Shepherd version or commit
      description: The release, or `git rev-parse --short HEAD` if you built from source.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 26.1, MacBook Pro with a notch
    validations:
      required: true
  - type: checkboxes
    id: sources
    attributes:
      label: Where your agents come from
      options:
        - label: tmux
        - label: herdr
        - label: Agent reports (`shepherd-report`)
  - type: input
    id: tools
    attributes:
      label: Agents and tool versions
      description: The agents involved, and your tmux or herdr version if they matter.
      placeholder: Claude Code 2.1, Codex, tmux 3.5a, herdr 0.9.3
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Your config (`~/.config/shepherd/config.json`), plugins you use, a screenshot.

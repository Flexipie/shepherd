name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: make build
      - name: Test
        run: make test
      # References are compared only on the OS build they were recorded on; elsewhere the views
      # are rendered and uploaded here so a reviewer can see them.
      - name: Upload view renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: view-renders
          path: |
            .build/snapshot-renders
            .build/snapshot-failures
          if-no-files-found: ignore
